---
# Playbook AAP : reprise des plannings bloqués.
# L'inventaire est fourni par AAP.
# Job Template AAP (un par environnement) :
#   - Extra Variables : env_name: preprod   (ou prod)
#   - Credentials     : machine + Vault (vault-id preprod ou prod)

- name: Reprise des plannings bloqués
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false

  # Décommenter si le script doit tourner sous un compte applicatif
  # become: true
  # become_user: appuser

  roles:
    # Toujours en premier : charge vars/<env_name>/ common.yml, reprise_planning.yml, vault.yml
    - role: load_env
      vars:
        load_env_files:
          - reprise_planning
    - reprise_planning
