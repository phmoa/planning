---
# Chargement des variables d'environnement, commun à tous les playbooks.
# Utilisation : placer ce rôle en premier dans chaque play, en listant
# les fichiers propres au playbook :
#   roles:
#     - role: load_env
#       vars:
#         load_env_files: [reprise_planning]
#     - reprise_planning
#
# Fichiers chargés depuis vars/<env_name>/ (et uniquement ceux-là) :
#   - common.yml   (toujours)
#   - <fichiers listés dans load_env_files>.yml
#   - vault.yml    (toujours, chiffré)
#
# env_name (preprod | prod) est défini dans les Extra Variables du Job Template AAP
# (ou, mieux, dans les variables de l'inventaire AAP).

- name: Vérifier les paramètres de load_env
  ansible.builtin.assert:
    that:
      - env_name is defined
      - env_name in load_env_allowed
      - load_env_files is sequence
      - load_env_files is not string
      - load_env_files | select('search', '[/\\\\]|\\.\\.') | list | length == 0
    fail_msg: >-
      {% if env_name is not defined %}env_name est absent.
      {%- elif env_name not in load_env_allowed %}env_name = {{ env_name }} est invalide.
      {%- else %}load_env_files doit être une liste de noms de fichiers sans chemin ni extension (ex. [reprise_planning]).
      {%- endif %}
      Valeurs possibles pour env_name : {{ load_env_allowed | join(', ') }}.
    quiet: true

- name: Vérifier la présence des fichiers à charger (contrôleur)
  ansible.builtin.stat:
    path: "{{ load_env__dir }}/{{ item }}.yml"
  loop: "{{ load_env__file_list }}"
  delegate_to: localhost
  run_once: true
  register: load_env__stat

- name: Arrêter si un fichier est absent
  ansible.builtin.fail:
    msg: >-
      Fichier(s) introuvable(s) dans vars/{{ env_name }}/ :
      {{ load_env__stat.results | rejectattr('stat.exists') | map(attribute='item') | map('regex_replace', '$', '.yml') | join(', ') }}
  when: load_env__stat.results | rejectattr('stat.exists') | list | length > 0

- name: Vérifier que vault.yml est chiffré
  when: load_env_require_encrypted_vault | bool
  block:
    - name: Lire l'en-tête de vault.yml (contrôleur)
      ansible.builtin.command:
        argv: [head, -c, "14", "{{ load_env__dir }}/vault.yml"]
      delegate_to: localhost
      run_once: true
      changed_when: false
      failed_when: false
      register: load_env__vault_head

    - name: Arrêter si vault.yml est en clair
      ansible.builtin.fail:
        msg: >-
          vars/{{ env_name }}/vault.yml n'est PAS chiffré.
          Le chiffrer : ansible-vault encrypt --vault-id {{ env_name }}@prompt vars/{{ env_name }}/vault.yml
      when: load_env__vault_head.stdout | default('') != '$ANSIBLE_VAULT'

# Fichiers non sensibles : pas de no_log, pour que l'erreur YAML soit affichée
- name: Charger les variables non sensibles
  block:
    - name: Charger les fichiers non sensibles
      ansible.builtin.include_vars:
        file: "{{ load_env__dir }}/{{ item }}.yml"
      loop: "{{ load_env__file_list | reject('eq', 'vault') | list }}"

  rescue:
    - name: Arrêter en indiquant le fichier invalide
      ansible.builtin.fail:
        msg: >-
          {% for r in ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') -%}
          Fichier invalide : vars/{{ env_name }}/{{ r.item }}.yml : {{ r.message | default(r.msg) | default('erreur inconnue') }}
          {% else -%}
          Impossible de charger les variables de vars/{{ env_name }}/ : {{ ansible_failed_result.msg | default('erreur inconnue') }}
          {%- endfor %}

- name: Charger les secrets
  block:
    - name: Charger vault.yml
      ansible.builtin.include_vars:
        file: "{{ load_env__dir }}/vault.yml"
      # Masque les valeurs déchiffrées dans la sortie AAP
      no_log: true

  rescue:
    - name: Arrêter avec la cause probable
      ansible.builtin.fail:
        msg: >-
          Impossible de charger vars/{{ env_name }}/vault.yml (détail masqué car il peut contenir des secrets).
          Causes possibles : credential Vault '{{ env_name }}' absent du Job Template ou mot de passe incorrect,
          fichier chiffré avec un autre vault-id, ou YAML invalide une fois déchiffré.
          Vérifier localement : ansible-vault view --vault-id {{ env_name }}@prompt vars/{{ env_name }}/vault.yml
