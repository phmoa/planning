---
- name: Créer le dossier du script
  ansible.builtin.file:
    path: "{{ reprise_planning_script_dir }}"
    state: directory
    mode: "0750"
    owner: "{{ reprise_planning_owner | default(omit, true) }}"
    group: "{{ reprise_planning_group | default(omit, true) }}"

- name: Déployer le script de reprise
  ansible.builtin.copy:
    src: reprise_planning.ksh
    dest: "{{ reprise_planning__script_path }}"
    mode: "0750"
    owner: "{{ reprise_planning_owner | default(omit, true) }}"
    group: "{{ reprise_planning_group | default(omit, true) }}"
