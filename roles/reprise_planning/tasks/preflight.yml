---
- name: Vérifier qu'un seul serveur est ciblé
  ansible.builtin.assert:
    that:
      - ansible_play_hosts_all | length == 1
    fail_msg: >-
      Le job cible {{ ansible_play_hosts_all | length }} serveurs ({{ ansible_play_hosts_all | join(', ') }}).
      La reprise agit sur une base partagée et ne doit tourner que sur un seul serveur :
      utiliser le champ Limit du Job Template.
    quiet: true

# Pas de no_log : en cas d'échec, seule l'expression évaluée est affichée, jamais la valeur.
- name: Vérifier les paramètres
  ansible.builtin.assert:
    that:
      - reprise_planning_db_user | string | length > 0
      - reprise_planning_db_user != 'CHANGE_ME'
      - reprise_planning_db_password | string | length > 0
      - reprise_planning_db_password != 'CHANGE_ME'
      - reprise_planning_db_tns != 'CHANGE_ME'
      - reprise_planning_timeout | int > 0
      - reprise_planning_db_check_timeout | int > 0
      - reprise_planning_oracle_env is mapping
      - reprise_planning_required_dirs is sequence
    fail_msg: >-
      Paramètre invalide (voir la condition en échec ci-dessus).
      Identifiants : vault_reprise_planning_db_* dans vars/{{ env_name | default('<env>') }}/vault.yml
      (absents ou encore à CHANGE_ME).
    quiet: true

- name: Vérifier l'interpréteur {{ reprise_planning_shell }}
  ansible.builtin.stat:
    path: "{{ reprise_planning_shell }}"
  register: reprise_planning__shell

- name: Arrêter si l'interpréteur est absent
  ansible.builtin.fail:
    msg: "Interpréteur introuvable ou non exécutable sur {{ inventory_hostname }} : {{ reprise_planning_shell }}"
  when: not (reprise_planning__shell.stat.exists and reprise_planning__shell.stat.executable)

# "command -v" est une commande interne du shell : le module shell est nécessaire
- name: Vérifier les commandes nécessaires
  ansible.builtin.shell: "command -v {{ item }}"  # noqa: command-instead-of-shell
  loop:
    - sqlplus
    - timeout
  environment: "{{ reprise_planning_oracle_env }}"
  register: reprise_planning__tools
  changed_when: false
  failed_when: false

- name: Arrêter si une commande est introuvable
  ansible.builtin.fail:
    msg: >-
      Commande(s) introuvable(s) sur {{ inventory_hostname }} :
      {{ reprise_planning__tools.results | rejectattr('rc', 'eq', 0) | map(attribute='item') | join(', ') }}.
      AAP n'exécute pas le .profile du compte : renseigner reprise_planning_oracle_env
      (ORACLE_HOME, PATH, LD_LIBRARY_PATH, TNS_ADMIN) dans vars/{{ env_name | default('<env>') }}/reprise_planning.yml.
  when: reprise_planning__tools.results | rejectattr('rc', 'eq', 0) | list | length > 0

- name: Vérifier les répertoires de travail
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ reprise_planning_required_dirs }}"
  loop_control:
    label: "{{ item.path }}"
  register: reprise_planning__dirs

- name: Arrêter si un répertoire est absent ou inaccessible
  ansible.builtin.fail:
    msg: >-
      {{ item.item.path }} :
      {% if not item.stat.exists %}introuvable
      {% elif not item.stat.isdir %}n'est pas un répertoire
      {% else %}non accessible en écriture pour {{ ansible_user_id | default("le compte d'exécution") }}{% endif %}
  loop: "{{ reprise_planning__dirs.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: >-
    not item.stat.exists
    or not item.stat.isdir
    or ((item.item.writable | default(false) | bool) and not item.stat.writeable)

- name: Tester la connexion Oracle et les droits sur les tables
  when: reprise_planning_db_check | bool
  block:
    # Le mot de passe passe par stdin, pas par la ligne de commande.
    # Aucune donnée n'est lue ni modifiée (ROWNUM < 1), puis ROLLBACK.
    - name: Se connecter à la base et vérifier les tables
      ansible.builtin.command:
        argv:
          - timeout
          - "{{ reprise_planning_db_check_timeout | string }}"
          - sqlplus
          - -S
          - -L
          - /nolog
        stdin: |
          WHENEVER SQLERROR EXIT FAILURE ROLLBACK
          WHENEVER OSERROR EXIT FAILURE ROLLBACK
          CONNECT {{ reprise_planning__connect_string }}
          SELECT 'CONNEXION_OK' FROM dual;
          {% for t in reprise_planning__tables_read %}
          SELECT COUNT(*) FROM {{ t }} WHERE ROWNUM < 1;
          {% endfor %}
          SELECT 1 FROM {{ reprise_planning__table_update }} WHERE ROWNUM < 1 FOR UPDATE;
          ROLLBACK;
          SELECT 'TABLES_OK' FROM dual;
          EXIT
      environment: "{{ reprise_planning_oracle_env }}"
      register: reprise_planning__db
      changed_when: false
      failed_when: false
      no_log: true

    - name: Arrêter si la connexion ou l'accès aux tables échoue
      vars:
        reprise_planning__db_errors: >-
          {{ (reprise_planning__db.stdout_lines | default([]) + reprise_planning__db.stderr_lines | default([]))
             | select('search', reprise_planning__ora_regex) | map('trim') | unique | list }}
        reprise_planning__db_target: >-
          utilisateur {{ reprise_planning_db_user }},
          base {{ reprise_planning_db_tns if reprise_planning_db_tns | length > 0 else 'ORACLE_SID' }}
      ansible.builtin.fail:
        msg: >-
          {%- set out = reprise_planning__db.stdout | default('') -%}
          {%- if 'CONNEXION_OK' not in out -%}Connexion Oracle impossible
          {%- else -%}Connexion OK mais accès refusé à une table{%- endif %}
          ({{ reprise_planning__db_target }}) :
          {% if reprise_planning__db.rc | default(-1) == 124 -%}
          délai de {{ reprise_planning_db_check_timeout }} s dépassé (listener ou réseau injoignable).
          {%- elif reprise_planning__db_errors | length > 0 -%}
          {{ reprise_planning__db_errors | join(' | ') }}.
          {%- if 'CONNEXION_OK' in out %} Tables vérifiées :
          {{ reprise_planning__tables_read | join(', ') }} (lecture), {{ reprise_planning__table_update }} (mise à jour).
          {%- endif -%}
          {%- else -%}
          code retour {{ reprise_planning__db.rc | default('n/a') }} {{ reprise_planning__db.msg | default('') }}
          {%- endif %}
      when: >-
        reprise_planning__db.rc | default(-1) != 0
        or 'TABLES_OK' not in reprise_planning__db.stdout | default('')
