# Inventaire de TEST LOCAL UNIQUEMENT (contient des mots de passe en clair).
# Ne pas pousser dans git : ce fichier est exclu par .gitignore.
#
# Le playbook refuse de cibler plus d'un serveur : toujours limiter à un groupe ou un hôte.
#   ansible-playbook -i inventories/test.ini playbooks/reprise_planning.yml \
#     --limit preprod --vault-id preprod@prompt
#
# Contrôles + déploiement sans exécuter le script :
#   ... -e reprise_planning_run=false
#
# Connexion par mot de passe : le paquet sshpass doit être installé sur la machine qui lance Ansible.

[preprod]
CHANGE_ME_serveur_preprod ansible_host=CHANGE_ME_ip_ou_fqdn

[prod]
CHANGE_ME_serveur_prod ansible_host=CHANGE_ME_ip_ou_fqdn

# Environnement, compte SSH et sudo pour PREPROD
[preprod:vars]
env_name=preprod
ansible_user=CHANGE_ME_compte_ssh
ansible_password=CHANGE_ME_mot_de_passe_ssh
ansible_become_password=CHANGE_ME_mot_de_passe_sudo

# Environnement, compte SSH et sudo pour PROD
[prod:vars]
env_name=prod
ansible_user=CHANGE_ME_compte_ssh
ansible_password=CHANGE_ME_mot_de_passe_ssh
ansible_become_password=CHANGE_ME_mot_de_passe_sudo

# Élévation de privilèges commune aux deux environnements
[all:vars]
ansible_python_interpreter=auto_silent
ansible_become=true
ansible_become_method=sudo
# Compte cible du sudo. root par défaut ; mettre le compte applicatif
# si le script et ses fichiers doivent lui appartenir.
ansible_become_user=root
