---
# Toute erreur d'une étape est rattrapée ici, résumée, puis le job est mis en échec.
# Le verrou d'exécution est toujours libéré.
- name: Reprise des plannings
  block:
    - name: Contrôles préalables
      ansible.builtin.import_tasks: preflight.yml

    - name: Déploiement du script
      ansible.builtin.import_tasks: deploy.yml

    - name: Exécution du script
      ansible.builtin.import_tasks: run.yml
      when: reprise_planning_run | bool

  rescue:
    - name: Échec de la reprise
      ansible.builtin.fail:
        msg: >-
          Échec à l'étape « {{ ansible_failed_task.name | default('inconnue') }} » sur {{ inventory_hostname }} :
          {{ ansible_failed_result.msg | default('voir la tâche en erreur ci-dessus') }}

  always:
    - name: Libérer le verrou d'exécution
      ansible.builtin.file:
        path: "{{ reprise_planning__lock_dir }}"
        state: absent
      changed_when: false
      when: reprise_planning__lock_acquired | default(false) | bool
